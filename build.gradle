plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}


java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }

    runs {
        server {
            server()
            systemProperty 'neoforge.logging.console.level', 'debug'
            programArgument '--nogui'
        }

        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.logging.console.level', 'debug'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'lootrteams'
            systemProperty 'lootrteams.testMode', 'true'
        }
    }

    mods {
        lootrteams {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    test {
        java { srcDir 'src/test/java' }
        resources { srcDir 'src/test/resources' }
    }
}

repositories {
    mavenCentral()
    maven { url 'https://maven.neoforged.net/releases' }
    maven { url 'https://www.cursemaven.com' }
    exclusiveContent {
        forRepository { maven { url 'https://maven.ftb.team/releases' } }
        filter { includeGroupByRegex 'dev\\.ftb\\..*' }
    }
    maven { url 'https://maven.saps.dev/minecraft' }
}

dependencies {
    // Lootr: required dependency (NeoForge 1.21.1)
    implementation "curse.maven:lootr-361276:8695784"

    // FTB Teams: optional dependency (compileOnly) (NeoForge 1.21.1)
    compileOnly "curse.maven:ftb-teams-forge-404468:8724782"
    testCompileOnly "curse.maven:ftb-teams-forge-404468:8724782"

    // Testing dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
    testImplementation 'org.mockito:mockito-core:5.4.0'
}

test {
    useJUnitPlatform()
    exclude '**/gametest/**'
}

jar {
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Implementation-Title'  : mod_id,
            'Implementation-Version': project.version,
            'MixinConfigs'          : 'lootrteams.mixins.json'
        ])
    }
    exclude 'dev/franwdev/lootrteams/gametest/**'
}

tasks.named('processTestResources', ProcessResources).configure { duplicatesStrategy = DuplicatesStrategy.INCLUDE }

